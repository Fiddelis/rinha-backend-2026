services:
  app1: &app
    platform: linux/amd64
    image: fiddelis/rinha-backend-2026-app:latest
    environment:
      RINHA_IVF_NPROBE: "6"
      RINHA_RERANK_K: "16"
      RINHA_TREE_CONFIDENCE: "0.95"
      RINHA_CELL_FAST_MARGIN: "0.0"

    expose:
      - "8000"
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "165M"

  app2:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    networks:
      - rinha
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "20M"
networks:
  rinha:
    driver: bridge
